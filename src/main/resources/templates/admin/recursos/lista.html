<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Admin - Recursos')}"></head>
<body>

<div th:replace="~{layout :: navbar}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="mb-1">Admin - Recursos</h1>
            <p class="text-muted mb-0">Crear, editar, activar/desactivar y eliminar recursos.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/recursos/nuevo}">+ Nuevo recurso</a>
    </div>

    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>

    <div class="table-responsive">
        <table class="table table-dark table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Lenguaje</th>
                <th>Nivel</th>
                <th>Tipo</th>
                <th>Activo</th>
                <th style="width: 260px;">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${items}">
                <td th:text="${r.id}">1</td>
                <td>
                    <div class="fw-semibold" th:text="${r.titulo}">Título</div>
                    <div class="small text-muted text-truncate" style="max-width: 520px;" th:text="${r.url}">url</div>
                </td>
                <td th:text="${r.lenguaje}">JAVA</td>
                <td th:text="${r.nivel}">BASICO</td>
                <td th:text="${r.tipo}">GUIA</td>
                <td>
                    <span class="badge"
                          th:classappend="${r.activo} ? ' text-bg-success' : ' text-bg-secondary'"
                          th:text="${r.activo} ? 'SI' : 'NO'">SI</span>
                </td>
                <td class="d-flex gap-2">
                    <a class="btn btn-sm btn-outline-info"
                       th:href="@{|/admin/recursos/${r.id}/editar|}">Editar</a>

                    <form th:action="@{|/admin/recursos/${r.id}/toggle|}" method="post" class="m-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-sm"
                                th:classappend="${r.activo} ? 'btn-outline-warning' : 'btn-outline-success'"
                                th:text="${r.activo} ? 'Desactivar' : 'Activar'">
                            Desactivar
                        </button>
                    </form>

                    <form th:action="@{|/admin/recursos/${r.id}/eliminar|}" method="post" class="m-0"
                          onsubmit="return confirm('¿Seguro que deseas eliminar este recurso?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script th:replace="~{layout :: scripts}"></script>
<script th:replace="~{layout :: appjs}"></script>
</body>
</html>
