<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Inicio')"></head>
<body>
<div th:replace="layout :: navbar"></div>

<main class="container py-4">

    <!-- Hero con video en loop -->
    <section class="hero-video mb-4 rounded-4 overflow-hidden shadow-lg position-relative">

        <!-- Video -->
        <video class="hero-video-el"
               autoplay
               muted
               loop
               playsinline
               preload="metadata"
               poster="/imgs/hero-poster.jpg">
            <!-- Fuente con y sin Thymeleaf (para evitar problemas de resolución de rutas) -->
            <source th:src="@{/videos/Main-video.mp4}" src="/videos/Main-video.mp4" type="video/mp4"/>
            Tu navegador no soporta el video HTML5.
        </video>

        <!-- Texto superpuesto -->
        <div class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-start text-white px-4 px-md-5"
             style="background: rgba(0,0,0,0.25);">
            <h1 class="display-6 fw-bold mb-2">Aprende a programar por niveles</h1>
            <p class="lead mb-3">Recursos en español, organizados por lenguaje y dificultad.</p>
            <a class="btn btn-primary btn-lg" th:href="@{/recursos}">Explorar recursos</a>
        </div>
    </section>

</main>

<div th:replace="layout :: footer"></div>
<script th:replace="layout :: scripts"></script>
<script th:replace="layout :: appjs"></script>
</body>
</html>
