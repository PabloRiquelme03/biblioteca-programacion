<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Recursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

<div class="d-flex align-items-center justify-content-between mb-3">
    <h2 th:text="'Recursos nivel ' + ${nivel}">Recursos</h2>
    <form method="get" action="#" class="d-flex gap-2">
        <select name="nivel" class="form-select">
            <option th:selected="${nivel.name()=='BASICO'}" value="BASICO">Básico</option>
            <option th:selected="${nivel.name()=='INTERMEDIO'}" value="INTERMEDIO">Intermedio</option>
            <option th:selected="${nivel.name()=='AVANZADO'}" value="AVANZADO">Avanzado</option>
        </select>
        <button class="btn btn-primary" type="submit">Filtrar</button>
    </form>
</div>

<div class="alert alert-info" th:if="${#lists.isEmpty(recursos)}">
    Aún no hay recursos en este nivel. (Agrega semillas de datos)
</div>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" th:if="${!#lists.isEmpty(recursos)}">
    <div class="col" th:each="r : ${recursos}">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title" th:text="${r.titulo}">Título</h5>
                <p class="card-text" th:text="${r.descripcion}">Descripción</p>
                <span class="badge text-bg-secondary" th:text="${r.lenguaje}">JAVA</span>
                <span class="badge text-bg-info" th:text="${r.tipo}">VIDEO</span>
                <span class="badge text-bg-light" th:text="${r.nivel}">BASICO</span>
            </div>
            <div class="card-footer">
                <a class="btn btn-sm btn-outline-primary" th:href="${r.url}" target="_blank" rel="noopener">Abrir</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
