<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Recursos')"></head>
<body>

<div th:replace="layout :: navbar"></div>

<main class="container py-4">
    <h1 class="mb-4">Recursos</h1>

    <!-- Filtros -->
    <form method="get" th:action="@{/recursos}"
          class="row g-2 mb-4 align-items-end justify-content-between">

        <!-- Selects + botón -->
        <div class="col-md-auto d-flex flex-wrap align-items-end gap-3">
            <!-- Lenguaje -->
            <div>
                <label for="lenguaje" class="form-label mb-1">Lenguaje</label>
                <select id="lenguaje" name="lenguaje" class="form-select">
                    <option value="" th:selected="${selectedLenguaje == null}">Todos</option>
                    <option th:each="len : ${lenguajes}"
                            th:value="${len}"
                            th:text="${len}"
                            th:selected="${selectedLenguaje == len}">
                    </option>
                </select>
            </div>

            <!-- Nivel -->
            <div>
                <label for="nivel" class="form-label mb-1">Nivel</label>
                <select id="nivel" name="nivel" class="form-select">
                    <option value="" th:selected="${selectedNivel == null}">Todos</option>
                    <option th:each="niv : ${niveles}"
                            th:value="${niv}"
                            th:text="${niv}"
                            th:selected="${selectedNivel == niv}">
                    </option>
                </select>
            </div>

            <!-- Botón filtrar -->
            <div>
                <button type="submit" class="btn btn-primary mt-1">Filtrar</button>
            </div>
        </div>

        <!-- Contador (derecha) -->
        <div class="col-md-auto text-end mt-2 mt-md-0">
            <div th:if="${#lists.size(recursos) > 0}"
                 class="text-muted small fade-in">
                Mostrando
                <strong th:text="${#lists.size(recursos)}">0</strong>
                recurso<span th:text="${#lists.size(recursos) != 1 ? 's' : ''}"></span>.
            </div>

            <div th:if="${#lists.size(recursos) == 0}"
                 class="text-muted small fade-in">
                No se encontraron recursos con los filtros seleccionados.
            </div>
        </div>
    </form>

    <!-- Tarjetas -->
    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="r : ${recursos}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title text-light" th:text="${r.titulo}">Título del recurso</h5>
                    <p class="card-text text-secondary" th:text="${r.descripcion}">Descripción</p>
                    <div class="d-flex gap-2">
                        <span class="badge text-bg-dark" th:text="${r.lenguaje}">JAVA</span>
                        <span class="badge text-bg-info" th:text="${r.tipo}">GUIA</span>
                        <span class="badge text-bg-secondary" th:text="${r.nivel}">BASICO</span>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <a class="btn btn-sm btn-primary"
                       th:href="${r.url}"
                       target="_blank"
                       rel="noopener">
                        Abrir
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="layout :: footer"></div>
<script th:replace="layout :: scripts"></script>
<script th:replace="layout :: appjs"></script>
</body>
</html>
