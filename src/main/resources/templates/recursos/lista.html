<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:replace="layout :: head('Recursos')"></head>
<body>

<!-- Navbar del layout -->
<div th:replace="layout :: navbar"></div>

<main class="container py-4">
    <h1 class="mb-4" th:text="'Recursos nivel ' + ${nivel}">Recursos</h1>

    <!-- Filtro por nivel -->
    <form method="get" th:action="@{/recursos}" class="mb-4 d-flex gap-2">
        <select class="form-select w-auto" name="nivel">
            <option th:value="BASICO" th:selected="${nivel == 'BASICO'}">Básico</option>
            <option th:value="INTERMEDIO" th:selected="${nivel == 'INTERMEDIO'}">Intermedio</option>
            <option th:value="AVANZADO" th:selected="${nivel == 'AVANZADO'}">Avanzado</option>
        </select>
        <button type="submit" class="btn btn-primary">Filtrar</button>
    </form>

    <!-- Tarjetas -->
    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="r : ${recursos}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${r.titulo}">Título del recurso</h5>
                    <p class="card-text" th:text="${r.descripcion}">Descripción</p>
                    <div class="d-flex gap-2">
                        <span class="badge text-bg-dark" th:text="${r.lenguaje}">JAVA</span>
                        <span class="badge text-bg-info" th:text="${r.tipo}">GUIA</span>
                        <span class="badge text-bg-secondary" th:text="${r.nivel}">BASICO</span>
                    </div>
                </div>

                <div class="card-footer">
                    <div class="d-flex justify-content-between align-items-center w-100">
                        <a class="btn btn-sm btn-primary" th:href="${r.url}" target="_blank" rel="noopener">Abrir</a>

                        <!-- Área de progreso (solo usuarios autenticados) -->
                        <div sec:authorize="isAuthenticated()">
                            <!-- Si NO está completado -->
                            <div th:if="${completados == null || !completados.contains(r.id)}">
                                <form th:action="@{|/progreso/${r.id}/completar|}" method="post" class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="back" th:value="@{|/recursos?nivel=${nivel}|}"/>
                                    <button class="btn btn-sm btn-outline-success">Marcar como completado</button>
                                </form>
                            </div>
                            <!-- Si ya está completado -->
                            <div th:if="${completados != null && completados.contains(r.id)}" class="d-flex align-items-center gap-2">
                                <span class="badge text-bg-success">Completado</span>
                                <form th:action="@{|/progreso/${r.id}/desmarcar|}" method="post" class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="back" th:value="@{|/recursos?nivel=${nivel}|}"/>
                                    <button class="btn btn-sm btn-outline-warning">Desmarcar</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Footer + scripts del layout -->
<div th:replace="layout :: footer"></div>
<script th:replace="layout :: scripts"></script>
<script th:replace="layout :: appjs"></script>
</body>
</html>
