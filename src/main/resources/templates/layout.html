<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${title} ?: 'Biblioteca de Programación'">Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Biblioteca</a>

        <div class="ms-auto d-flex gap-2 align-items-center">

            <!-- Navegación principal -->
            <a class="btn btn-outline-primary" th:href="@{/recursos}">Recursos</a>
            <a class="btn btn-outline-primary" th:href="@{/cursos}">Cursos</a>
            <a class="btn btn-outline-primary" th:href="@{/notas}">Notas</a>

            <!-- Link a Mi progreso si está autenticado -->
            <a class="btn btn-outline-success" th:href="@{/perfil/progreso}" sec:authorize="isAuthenticated()">
                Mi progreso
            </a>

            <!-- Si NO está autenticado -->
            <div sec:authorize="!isAuthenticated()">
                <a class="btn btn-outline-secondary" th:href="@{/auth/login}">Ingresar</a>
                <a class="btn btn-primary" th:href="@{/auth/registro}">Registrarse</a>
            </div>

            <!-- Si está autenticado -->
            <div class="d-flex gap-2 align-items-center" sec:authorize="isAuthenticated()">
                <span class="text-muted small">
                    Hola, <span sec:authentication="name">usuario</span>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn btn-danger">Salir</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<footer class="text-center text-muted py-4" th:fragment="footer">
    © 2025 Biblioteca
</footer>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:fragment="appjs" th:src="@{/js/app.js}"></script>
</body>
</html>
