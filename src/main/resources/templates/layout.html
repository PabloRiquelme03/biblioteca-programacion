<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="${title} ?: 'Biblioteca de Programación'">Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-light border-bottom" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Biblioteca</a>
        <div class="ms-auto">
            <a class="btn btn-outline-primary" th:href="@{/recursos}">Recursos</a>
        </div>
    </div>
</nav>

<footer class="text-center text-muted py-4" th:fragment="footer">
    © 2025 Biblioteca
</footer>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:fragment="appjs" th:src="@{/js/app.js}"></script>
</body>
</html>
