<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Nueva contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="auth-wrap">
    <!-- Lado imagen -->
    <section class="auth-hero">
        <div class="brand">Biblioteca</div>
        <div class="caption">
            <h2>Restablecer contraseña</h2>
            <p>Ingresa una nueva contraseña segura para tu cuenta.</p>
        </div>
    </section>

    <!-- Lado formulario -->
    <section class="auth-panel">
        <div class="auth-card">
            <h3 class="auth-title">Nueva contraseña</h3>
            <p class="auth-muted">Escribe tu nueva clave para continuar.</p>

            <!-- Mensajes -->
            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
            <div th:if="${ok}" class="alert alert-success py-2" th:text="${ok}"></div>

            <!-- Formulario -->
            <form method="post" th:action="@{/auth/reset}">
                <input type="hidden" name="token" th:value="${token}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label">Nueva contraseña</label>
                    <input class="form-control" type="password" name="password" placeholder="••••••••" minlength="6" required>
                </div>

                <button class="btn btn-primary w-100 py-2">Actualizar contraseña</button>
            </form>

            <!-- Enlaces inferiores -->
            <div class="d-flex justify-content-between align-items-center mt-3">
                <a th:href="@{/auth/login}" class="text-decoration-none">← Volver a iniciar sesión</a>
                <span class="text-muted">¿No tienes cuenta?
                    <a th:href="@{/auth/registro}">Regístrate</a>
                </span>
            </div>
        </div>
    </section>
</div>

<!-- Botón flotante de tema -->
<button id="themeToggleFab" type="button" class="btn btn-outline-secondary theme-fab">🌙</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
