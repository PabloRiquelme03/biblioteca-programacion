<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Restablecer contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="auth-wrap">
    <!-- Imagen -->
    <section class="auth-hero">
        <div class="brand">Biblioteca</div>
        <div class="caption">
            <h2>Nueva contraseña</h2>
            <p>Elige una contraseña segura para tu cuenta.</p>
        </div>
    </section>

    <!-- Formulario -->
    <section class="auth-panel">
        <div class="auth-card">
            <h3 class="auth-title">Restablecer contraseña</h3>
            <p class="auth-muted">Ingresa tu nueva contraseña dos veces.</p>

            <!-- Mensajes -->
            <div th:if="${ok}" class="alert alert-success py-2" th:text="${ok}"></div>
            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

            <form method="post" th:action="@{/auth/reset}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="token" th:value="${token}"/>

                <div class="mb-3">
                    <label class="form-label">Nueva contraseña</label>
                    <input class="form-control" type="password" name="password" placeholder="••••••••" minlength="6" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirmar contraseña</label>
                    <input class="form-control" type="password" name="password2" placeholder="••••••••" minlength="6" required>
                </div>

                <button class="btn btn-primary w-100 py-2">Guardar</button>
            </form>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <a th:href="@{/auth/login}" class="text-decoration-none">← Volver a ingresar</a>
                <a th:href="@{/}" class="text-decoration-none">Ir al inicio</a>
            </div>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
