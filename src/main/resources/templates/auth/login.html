<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ingresar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Botón flotante de tema -->
<div class="theme-fab">
    <button id="themeToggleFab" class="btn btn-outline-secondary btn-sm" type="button">🌙</button>
</div>

<div class="auth-wrap">
    <!-- Lado imagen -->
    <section class="auth-hero">
        <div class="brand">Biblioteca</div>
        <div class="caption">
            <h2>Aprende creando.</h2>
            <p>Recursos curados por nivel y lenguaje.</p>
        </div>
    </section>

    <!-- Lado formulario -->
    <section class="auth-panel">
        <div class="auth-card">
            <h3 class="auth-title">Ingresar</h3>
            <p class="auth-muted">Bienvenido de vuelta. Accede con tu correo y clave.</p>

            <div th:if="${param.error}" class="alert alert-danger py-2">
                Credenciales inválidas. Revisa email/contraseña.
            </div>
            <div th:if="${ok}" class="alert alert-success py-2" th:text="${ok}"></div>

            <form method="post" th:action="@{/auth/login}">
                <!-- CSRF -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" name="username" placeholder="tucorreo@ejemplo.cl" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input class="form-control" type="password" name="password" placeholder="••••••••" required>
                </div>

                <button class="btn btn-primary w-100 py-2">Entrar</button>
            </form>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <a th:href="@{/}" class="text-decoration-none">← Volver al inicio</a>
                <span class="text-muted">¿No tienes cuenta?
                  <a th:href="@{/auth/registro}">Regístrate</a>
                </span>
            </div>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
