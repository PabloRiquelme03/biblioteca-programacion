<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ingresar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="col-md-5 mx-auto">
        <h3 class="mb-3">Ingresar</h3>

        <!-- mensaje si vienes de registro exitoso -->
        <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>

        <div th:if="${param.error}" class="alert alert-danger">
            Credenciales inválidas. Revisa email/contraseña.
        </div>
        <div th:if="${param.logout}" class="alert alert-info">
            Sesión cerrada correctamente.
        </div>

        <form method="post" th:action="@{/auth/login}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div th:if="${param.error}" class="alert alert-danger">
                Credenciales inválidas. Revisa email/contraseña.
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" name="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input class="form-control" type="password" name="password" required>
            </div>
            <button class="btn btn-primary w-100">Entrar</button>
        </form>


        <p class="mt-3">¿No tienes cuenta?
            <a th:href="@{/auth/registro}">Regístrate</a>
        </p>
    </div>
</div>
</body>
</html>
