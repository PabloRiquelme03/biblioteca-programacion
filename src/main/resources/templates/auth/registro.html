<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Crear cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="auth-wrap">
    <!-- Imagen -->
    <section class="auth-hero">
        <div class="brand">Biblioteca</div>
        <div class="caption">
            <h2>Únete y progresa.</h2>
            <p>Marca tu avance y guarda tus favoritos.</p>
        </div>
    </section>

    <!-- Formulario -->
    <section class="auth-panel">
        <div class="auth-card">
            <h3 class="auth-title">Crear cuenta</h3>
            <p class="auth-muted">Completa tus datos para empezar.</p>

            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

            <form method="post" th:action="@{/auth/registro}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input class="form-control" name="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" name="email" placeholder="tucorreo@ejemplo.cl" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input class="form-control" type="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>

                <button class="btn btn-primary w-100 py-2">Registrarme</button>
            </form>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <a th:href="@{/}" class="text-decoration-none">← Volver al inicio</a>
                <span class="text-muted">¿Ya tienes cuenta? <a th:href="@{/auth/login}">Ingresar</a></span>
            </div>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
