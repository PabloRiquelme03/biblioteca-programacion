<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="col-md-5 mx-auto">
        <h3 class="mb-3">Crear cuenta</h3>

        <!-- mensaje de error si el email ya existe -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- formulario de registro -->
        <form method="post" th:action="@{/auth/registro}">
            <!-- 🔑 CSRF -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input class="form-control" name="nombre" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" name="email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input class="form-control" type="password" name="password" required minlength="6">
            </div>

            <button class="btn btn-primary w-100">Registrarme</button>
        </form>

        <p class="mt-3">¿Ya tienes cuenta?
            <a th:href="@{/auth/login}">Ingresar</a>
        </p>
    </div>
</div>
</body>
</html>
