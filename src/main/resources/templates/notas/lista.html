<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Cuaderno de anotaciones')"></head>
<body>
<div th:replace="layout :: navbar"></div>

<main class="container py-4">
    <h1 class="mb-4">Cuaderno de anotaciones</h1>

    <!-- Formulario nueva nota -->
    <form th:action="@{/notas}" method="post" class="mb-4 d-flex flex-column gap-2">
        <!-- Campo título -->
        <div>
            <input type="text"
                   name="titulo"
                   class="form-control mb-1"
                   placeholder="Título (máx. 50 caracteres)"
                   maxlength="50"
                   id="tituloInput"
                   required>
            <small class="text-muted contador" id="tituloCount">0 / 50</small>
        </div>

        <!-- Campo descripción multilínea -->
        <div>
            <textarea name="contenido"
                      class="form-control mb-1"
                      placeholder="Escribe una nota... (máx. 300 caracteres)"
                      maxlength="300"
                      id="contenidoInput"
                      rows="4"
                      required></textarea>
            <small class="text-muted contador" id="contenidoCount">0 / 300</small>
        </div>

        <button class="btn btn-primary align-self-start">Guardar</button>
    </form>

    <!-- Lista de notas -->
    <div class="row g-3" th:if="${notas}">
        <div class="col-md-6 col-lg-4" th:each="n : ${notas}">
            <div class="card h-100 bg-dark text-light border-secondary shadow-sm">
                <div class="card-body">
                    <h5 th:text="${n.titulo}" class="fw-semibold text-white">Título</h5>
                    <p th:text="${n.contenido}" class="text-light small mb-2 white-space-pre-line">Contenido</p>
                    <p class="text-muted small mb-0"
                       th:text="${#temporals.format(n.actualizado, 'dd/MM/yyyy HH:mm')}">fecha</p>
                </div>
                <div class="card-footer border-secondary">
                    <form method="post" th:action="@{|/notas/${n.id}/eliminar|}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="layout :: footer"></div>
<script th:replace="layout :: scripts"></script>
<script th:replace="layout :: appjs"></script>

<!-- Contador dinámico -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const titulo = document.getElementById("tituloInput");
        const contenido = document.getElementById("contenidoInput");
        const tituloCount = document.getElementById("tituloCount");
        const contenidoCount = document.getElementById("contenidoCount");

        if (titulo && contenido) {
            titulo.addEventListener("input", () => {
                tituloCount.textContent = `${titulo.value.length} / 50`;
                tituloCount.classList.toggle("text-warning", titulo.value.length > 45);
            });

            contenido.addEventListener("input", () => {
                contenidoCount.textContent = `${contenido.value.length} / 300`;
                contenidoCount.classList.toggle("text-warning", contenido.value.length > 270);
            });
        }
    });
</script>
</body>
</html>
