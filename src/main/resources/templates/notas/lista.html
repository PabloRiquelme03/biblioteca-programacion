<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:replace="layout :: head('Mis notas')"></head>
<body>
<div th:replace="layout :: navbar"></div>

<main class="container py-4">
    <h1 class="mb-4">Cuaderno de anotaciones</h1>

    <form method="post" th:action="@{/notas}" class="card p-3 mb-4" sec:authorize="isAuthenticated()">
        <div class="row g-2">
            <div class="col-md-4">
                <input name="titulo" class="form-control" placeholder="Título" required>
            </div>
            <div class="col-md-6">
                <input name="contenido" class="form-control" placeholder="Escribe una nota..." required>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100">Guardar</button>
            </div>
        </div>
    </form>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="n : ${notas}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 th:text="${n.titulo}">Título</h5>
                    <p th:text="${n.contenido}">contenido</p>
                    <p class="text-muted small mb-0" th:text="${#temporals.format(n.actualizado, 'dd/MM/yyyy HH:mm')}">fecha</p>
                </div>
                <div class="card-footer">
                    <form method="post" th:action="@{|/notas/${n.id}/eliminar|}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="layout :: footer"></div>
<script th:replace="layout :: scripts"></script>
<script th:replace="layout :: appjs"></script>
</body>
</html>
