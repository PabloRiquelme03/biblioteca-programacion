<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:replace="layout :: head('Mi progreso')"></head>
<body>
<div th:replace="layout :: navbar"></div>

<main class="container py-4">
    <h1 class="mb-4">Mi progreso</h1>

    <div th:if="${#lists.isEmpty(items)}" class="alert alert-info">
        Aún no has marcado recursos como completados.
    </div>

    <div class="row g-3" th:if="${!#lists.isEmpty(items)}">
        <div class="col-md-6 col-lg-4" th:each="p : ${items}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.recurso.titulo}">Título</h5>
                    <p class="card-text">
                        <span class="badge text-bg-dark" th:text="${p.recurso.lenguaje}">JAVA</span>
                        <span class="badge text-bg-info" th:text="${p.recurso.tipo}">GUIA</span>
                        <span class="badge text-bg-secondary" th:text="${p.recurso.nivel}">BASICO</span>
                    </p>
                    <p class="text-muted mb-0">
                        Completado el <span th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}">fecha</span>
                    </p>
                </div>
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <a class="btn btn-sm btn-primary" th:href="${p.recurso.url}" target="_blank" rel="noopener">Abrir</a>
                    <form th:action="@{|/progreso/${p.recurso.id}/desmarcar|}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="back" th:value="@{/perfil/progreso}"/>
                        <button class="btn btn-sm btn-outline-warning">Desmarcar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="layout :: footer"></div>
<script th:replace="layout :: scripts"></script>
<script th:replace="layout :: appjs"></script>
</body>
</html>
